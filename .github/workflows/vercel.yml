name: Vercel CI/CD

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: vercel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.21.0"
  SUPABASE_CLI_VERSION: "2.115.0"

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build
        run: pnpm check

  supabase-production:
    name: Deploy Supabase production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_SUPABASE_DEPLOY == 'true'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate deployment secrets
        shell: bash
        run: |
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub Actions secret ${name} is required."
              exit 1
            fi
          done

      - name: Validate pending database migrations
        run: npx --yes "supabase@${SUPABASE_CLI_VERSION}" db push --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --include-all --dry-run

      - name: Apply database migrations
        run: npx --yes "supabase@${SUPABASE_CLI_VERSION}" db push --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --include-all --yes

      - name: Deploy Supabase functions
        run: npx --yes "supabase@${SUPABASE_CLI_VERSION}" functions deploy public-form create-checkout stripe-webhook --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api
